[package]
name = "agentchan"
version = "0.1.2"
edition = "2024"
license = "MIT"
description = "MCP server that lets one coding agent talk to another: Claude Code, Codex or Grok"
repository = "https://github.com/damejeras/agentchan"
readme = "README.md"
keywords = ["mcp", "claude", "codex", "grok", "agent"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
anyhow = "1.0.104"
libc = "0.2.189"
rmcp = { version = "3.4.1", features = ["server", "transport-io", "macros"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "process", "io-util", "sync", "time", "signal"] }
tokio-util = { version = "0.7.19", features = ["rt"] }

[dev-dependencies]
rmcp = { version = "3.4.1", features = ["client", "transport-child-process"] }
tempfile = "3.27.0"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
